<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clinical Hypothesis Evaluation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Clinical Hypothesis Evaluation</h1>
            <p class="subtitle">Evaluate mechanistic hypotheses using 4 robustness gates</p>
        </header>

        <div class="controls">
            <div class="control-group">
                <label for="cohort-select">Select Trial Cohort:</label>
                <select id="cohort-select">
                    <option value="">-- Select Cohort --</option>
                    <option value="crash_2">CRASH-2 (Tranexamic Acid)</option>
                    <option value="ist3">IST-3 (Alteplase for Stroke)</option>
                    <option value="sprint">SPRINT (Intensive BP Control)</option>
                    <option value="accord">ACCORD-BP (Intensive BP Control in Diabetes)</option>
                    <option value="accord_glycemia">ACCORD (Glycemia)</option>
                </select>
            </div>

            <div class="control-group">
                <label for="expertise-select">Clinical Expertise:</label>
                <select id="expertise-select">
                    <option value="">-- Select Expertise Level --</option>
                    <option value="attending_1-5">Attending (1-5 years)</option>
                    <option value="attending_5plus">Attending (5+ years)</option>
                </select>
            </div>

            <div class="control-group">
                <label for="specialty-input">Specialty:</label>
                <select id="specialty-input">
                    <option value="">-- Select Specialty --</option>
                    <option value="Emergency">Emergency</option>
                    <option value="Surgery">Surgery</option>
                    <option value="Cardiology">Cardiology</option>
                    <option value="Internal Medicine">Internal Medicine</option>
                    <option value="Endocrinology and Metabolism">Endocrinology and Metabolism</option>
                    <option value="Neurology">Neurology</option>
                </select>
            </div>

            <div class="control-group">
                <label for="rater-id-input">Anonymous ID:</label>
                <input type="text" id="rater-id-input" placeholder="e.g., clinician_01" required>
            </div>

            <button id="load-btn" class="btn btn-primary">Load Hypotheses</button>
        </div>

        <div id="trial-info" class="info-box" style="display: none;">
            <h3>Trial Context</h3>
            <p><strong>Treatment:</strong> <span id="trial-treatment"></span></p>
            <p><strong>Outcome:</strong> <span id="trial-outcome"></span></p>
            <p><strong>Population:</strong> <span id="trial-population"></span></p>
            <p><strong>Description:</strong> <span id="trial-description"></span></p>
            <p><strong>Publication:</strong> <a id="trial-link" href="#" target="_blank" rel="noopener noreferrer"></a></p>
        </div>

        <div id="hypotheses-container"></div>

        <div id="summary-section" style="display: none;">
            <button id="submit-btn" class="btn btn-success">Submit Ratings</button>
            <p class="help-text">Click to submit your ratings directly</p>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="script.js"></script>
</body>
</html>
